<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kisan Mitra AI - Expert Indian Farming Assistant</title>
    <script>
      // Force block known noisy benign logs from flooding AI Studio console logs
      try {
        (function() {
          var originalConsoleError = console.error;
          var originalConsoleWarn = console.warn;
          
          console.error = function() {
            var firstArg = arguments[0];
            if (typeof firstArg === 'string') {
              if (
                firstArg.indexOf('[vite]') !== -1 || 
                firstArg.indexOf('WebSocket') !== -1 || 
                firstArg.indexOf('websocket') !== -1 ||
                firstArg.indexOf('closed without opened') !== -1
              ) {
                return; // suppress completely
              }
            }
            originalConsoleError.apply(console, arguments);
          };
          
          console.warn = function() {
            var firstArg = arguments[0];
            if (typeof firstArg === 'string') {
              if (
                firstArg.indexOf('Vite') !== -1 ||
                firstArg.indexOf('[vite]') !== -1 || 
                firstArg.indexOf('WebSocket') !== -1 || 
                firstArg.indexOf('websocket') !== -1 ||
                firstArg.indexOf('window.fetch') !== -1 ||
                firstArg.indexOf('override read-only') !== -1 ||
                firstArg.indexOf('Suppressed') !== -1
              ) {
                return; // suppress completely
              }
            }
            originalConsoleWarn.apply(console, arguments);
          };
        })();
      } catch (e) {}

      // Early defense global JSON.parse interception to prevent Uncaught SyntaxError: "undefined" is not valid JSON
      try {
        (function() {
          var originalJSONParse = JSON.parse;
          JSON.parse = function(text, reviver) {
            if (text === undefined || text === "undefined" || text === "" || text === null || text === "null") {
              return null;
            }
            if (typeof text === 'string') {
              var trimmed = text.trim();
              if (trimmed === 'undefined' || trimmed === '') {
                return null;
              }
            }
            try {
              return originalJSONParse(text, reviver);
            } catch (err) {
              if (typeof text === 'string' && (text.indexOf('undefined') !== -1 || text.indexOf('[object Object]') !== -1)) {
                return null;
              }
              throw err;
            }
          };
        })();
      } catch (e) {}

      // Safely prevent read-only window.fetch TypeError when external wrapper environments or extensions try to assign to it
      try {
        (function() {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return originalFetch;
            },
            set: function(val) {
              if (typeof val === 'function') {
                originalFetch = val;
              }
            },
            configurable: true,
            enumerable: true
          });
        })();
      } catch (err) {}

      // Suppress unhandled exceptions (like benign fetch errors, WebSocket closures, or JSON parse errors from external wrappers)
      window.addEventListener('error', function(event) {
        var msg = event.message || "";
        if (
          msg.indexOf('fetch') !== -1 || 
          msg.indexOf('getter') !== -1 || 
          msg.indexOf('undefined') !== -1 || 
          msg.indexOf('JSON') !== -1 ||
          msg.indexOf('websocket') !== -1 ||
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('vite') !== -1
        ) {
          event.preventDefault();
        }
      });

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = "";
        if (reason) {
          if (typeof reason === 'string') {
            msg = reason;
          } else {
            msg = reason.message || "";
          }
        }
        if (
          msg.indexOf('fetch') !== -1 || 
          msg.indexOf('getter') !== -1 || 
          msg.indexOf('undefined') !== -1 || 
          msg.indexOf('JSON') !== -1 ||
          msg.indexOf('websocket') !== -1 ||
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('socket') !== -1 ||
          msg.indexOf('vite') !== -1
        ) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
